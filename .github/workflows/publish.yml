name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dir: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            dir: linux-arm64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            dir: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            dir: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dir: win32-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked || true

      - name: Build release binary
        working-directory: rust
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Run unit tests (native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: rust
        run: cargo test

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.dir }}
          path: rust/target/${{ matrix.target }}/release/tavily-mcp-multi-key*
          if-no-files-found: error

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest # trusted publishing requires npm >= 11.5.1

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble npm package
        run: |
          mkdir -p bin
          for dir in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            src="artifacts/bin-$dir"
            [ -d "$src" ] || { echo "missing artifact bin-$dir"; exit 1; }
            mkdir -p "bin/$dir"
            cp -v "$src"/* "bin/$dir/"
          done
          # Windows exe rename (artifact glob may already have .exe)
          if [ -f bin/win32-x64/tavily-mcp-multi-key ] && [ ! -f bin/win32-x64/tavily-mcp-multi-key.exe ]; then
            mv bin/win32-x64/tavily-mcp-multi-key bin/win32-x64/tavily-mcp-multi-key.exe
          fi
          chmod +x bin/*/tavily-mcp-multi-key 2>/dev/null || true
          cp package.rust.json package.json
          ls -lhR bin | head -30

      - name: Smoke test the launcher (linux-x64)
        run: |
          node npm/launcher.js --list-tools | head -5
          echo "--- smoke via bin direct ---"
          ./bin/linux-x64/tavily-mcp-multi-key --list-tools | head -3

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          if [ "$(npm view @spraylee/tavily-mcp-multi-key version)" = "$(node -p "require('./package.json').version")" ]; then
            echo "::warning::npm 上该版本已存在，跳过发布（如需重发请先升 version）"
            exit 0
          fi
          npm publish --provenance --access public || npm publish --access public
