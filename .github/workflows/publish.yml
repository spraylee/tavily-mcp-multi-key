name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest # trusted publishing requires npm >= 11.5.1

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build & test
        run: |
          npm run build
          npm test

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          if [ "$(npm view @spraylee/tavily-mcp-multi-key version)" = "$(node -p "require('./package.json').version")" ]; then
            echo "::warning::npm 上该版本已存在，跳过发布（如需重发请先升 version）"
            exit 0
          fi
          npm publish --provenance --access public || npm publish --access public
