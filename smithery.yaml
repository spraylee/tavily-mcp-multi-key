# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - tavilyApiKey
    properties:
      tavilyApiKey:
        type: string
        description: The API key for the Tavily MCP server.
  commandFunction:
    # eval + command substitution keeps stdin free for the MCP JSON-RPC
    # channel; a literal `curl ... | sh` pipe would consume stdin.
    |-
    config => ({
      command: 'sh',
      args: ['-c', 'eval "$(curl -fsSL https://github.com/spraylee/tavily-mcp-multi-key/releases/latest/download/bootstrap.sh)"'],
      env: { TAVILY_API_KEY: config.tavilyApiKey }
    })
