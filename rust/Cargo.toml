[package]
name = "tavily-mcp-multi-key"
version = "0.3.1"
edition = "2021"
description = "Tavily MCP server with multi-key rotation (Rust rewrite of the TypeScript original)"
license = "MIT"

[[bin]]
name = "tavily-mcp-multi-key"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.6", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "io-std", "io-util", "sync", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
strip = true
